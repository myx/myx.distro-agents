display_information:
  name: Magic-Team
  description: Shared team bot for the Meloscope Magic-Team.
  background_color: "#2b2b2b"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Magic-Team
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - chat:write.public
      - users:read
      - users:read.email
      - users.profile:read
      - users:write
      - dnd:read
      - channels:read
      - channels:history
      - channels:join
      - channels:manage
      - groups:read
      - groups:history
      - groups:write
      - im:read
      - im:history
      - im:write
      - mpim:read
      - mpim:history
      - mpim:write
      - reactions:read
      - reactions:write
      - files:read
      - files:write
      - pins:read
      - pins:write
      - bookmarks:read
      - bookmarks:write
      - emoji:read
      - team:read
      - usergroups:read
      - links:read
      - calls:read
      - calls:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
